
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar meus dados - Automatic Fit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/perfil.css') }}">
</head>
<body>

    <main class="pagina-perfil">
        <section class="cartao-perfil">

            <img class="logo"
                 src="{{ url_for('static', filename='img/logo.png') }}"
                 alt="Logo Automatic Fit">

            <h1>Editar meus dados</h1>
            <p class="subtitulo">
                Atualize as informações da sua conta.
            </p>

            <!-- Mensagens do Flask -->
            {% with mensagens = get_flashed_messages(with_categories=True) %}
                {% for categoria, mensagem in mensagens %}
                    <p class="mensagem {{ categoria }}">{{ mensagem }}</p>
                {% endfor %}
            {% endwith %}

            <form action="{{ url_for('editar_dados') }}" method="POST">

                <!-- Nome -->
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text"
                           id="nome"
                           name="nome"
                           value="{{ dados[1] }}"
                           maxlength="254"
                           required>
                </div>

                <!-- E-mail -->
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email"
                           id="email"
                           name="email"
                           value="{{ dados[2] }}"
                           maxlength="100"
                           required>
                </div>

                <!-- Telefone -->
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel"
                           id="telefone"
                           name="telefone"
                           value="{{ dados[5] or '' }}"
                           maxlength="20">
                </div>

                <!-- CPF -->
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text"
                           id="cpf"
                           name="cpf"
                           value="{{ dados[6] or '' }}"
                           maxlength="14"
                           placeholder="Somente números">
                </div>

                <!-- Nascimento -->
                <div class="campo">
                    <label for="data_nascimento">Data de nascimento</label>
                    <input type="date"
                           id="data_nascimento"
                           name="data_nascimento"
                           value="{{ dados[7].isoformat() if dados[7] else '' }}">
                </div>

                <button class="botao" type="submit">
                    Salvar alterações
                </button>
            </form>

            <a class="voltar" href="{{ url_for('voltar_home') }}">
                Voltar para a Home
            </a>

        </section>
    </main>

</body>
</html>
